<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deluxe Bingo Caller</title>
  <style>
    :root {
      --bg1: #0b1220;
      --bg2: #111827;
      --card: rgba(17, 24, 39, 0.96);
      --card-2: #1f2937;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --green: #22c55e;
      --blue: #3b82f6;
      --red: #ef4444;
      --gold: #f59e0b;
      --shadow: 0 14px 30px rgba(0,0,0,.25);
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: clamp(1.9rem, 4vw, 2.8rem);
    }

    .subtitle {
      margin: 0;
      text-align: center;
      color: var(--muted);
    }

    .main {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 16px;
    }

    .current {
      min-height: 360px;
      display: grid;
      place-items: center;
      text-align: center;
      background: radial-gradient(circle at top, rgba(59,130,246,.18), transparent 45%),
                  linear-gradient(180deg, rgba(59,130,246,.10), rgba(34,197,94,.12));
      overflow: hidden;
      position: relative;
    }

    .pulse {
      animation: popIn .35s ease;
    }

    @keyframes popIn {
      0% { transform: scale(.82); opacity: .25; }
      100% { transform: scale(1); opacity: 1; }
    }

    .letter {
      font-size: clamp(3.4rem, 10vw, 6.5rem);
      font-weight: 900;
      letter-spacing: .12em;
      color: #93c5fd;
      margin-bottom: 6px;
    }

    .number {
      font-size: clamp(5rem, 16vw, 9rem);
      font-weight: 900;
      line-height: .9;
      text-shadow: 0 8px 24px rgba(0,0,0,.22);
    }

    .callout {
      margin-top: 10px;
      font-size: clamp(1.15rem, 3vw, 1.55rem);
      font-weight: 800;
      color: #fde68a;
      min-height: 1.5em;
    }

    .status {
      margin-top: 10px;
      color: var(--muted);
      font-size: 1rem;
    }

    .controls, .settings {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 14px;
    }

    button, select, input {
      appearance: none;
      border: 0;
      border-radius: 14px;
      padding: 13px 15px;
      font-size: 1rem;
      font-weight: 700;
    }

    button {
      cursor: pointer;
      color: white;
      box-shadow: var(--shadow);
      transition: transform .08s ease, opacity .2s ease;
    }

    button:active { transform: scale(.98); }
    button:disabled { cursor: not-allowed; opacity: .55; }

    select, input {
      background: #0b1324;
      color: white;
      border: 1px solid rgba(255,255,255,.1);
    }

    .call-btn { background: var(--green); color: #052e16; }
    .auto-btn { background: var(--gold); color: #3b2300; }
    .voice-btn { background: var(--blue); }
    .reset-btn { background: var(--red); }

    .history-wrap h2,
    .board-wrap h2,
    .settings-wrap h2 {
      margin-top: 0;
      font-size: 1.1rem;
    }

    .history {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      max-height: 360px;
      overflow: auto;
      padding-right: 4px;
    }

    .chip {
      background: var(--card-2);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      padding: 10px 8px;
      text-align: center;
      font-weight: 800;
    }

    .latest {
      border-color: rgba(245,158,11,.6);
      box-shadow: inset 0 0 0 1px rgba(245,158,11,.28);
      color: #fde68a;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .col-head {
      text-align: center;
      font-weight: 900;
      padding: 10px 0;
      border-radius: 12px;
      background: rgba(255,255,255,.06);
      letter-spacing: .08em;
    }

    .cell {
      text-align: center;
      padding: 10px 0;
      border-radius: 12px;
      background: #0b1324;
      border: 1px solid rgba(255,255,255,.07);
      font-weight: 700;
      color: var(--muted);
    }

    .called {
      background: linear-gradient(180deg, rgba(34,197,94,.18), rgba(34,197,94,.12));
      color: #dcfce7;
      border-color: rgba(34,197,94,.5);
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: .95rem;
    }

    .inline-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-weight: 700;
    }

    @media (max-width: 820px) {
      .main { grid-template-columns: 1fr; }
      .current { min-height: 300px; }
      .history { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      button { flex: 1 1 140px; }
      .settings { justify-content: stretch; }
      .settings > * { flex: 1 1 180px; }
    }

    @media (max-width: 520px) {
      .history { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      body { padding: 12px; }
      .card { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <h1>Deluxe Bingo Caller</h1>
      <p class="subtitle">Random calls, no repeats, auto-call, voice selection, and rapid-click protection.</p>
    </div>

    <div class="main">
      <div class="card current">
        <div>
          <div id="letter" class="letter">—</div>
          <div id="number" class="number">Start</div>
          <div id="callout" class="callout">Ready to call</div>
          <div id="status" class="status">75 balls remaining</div>

          <div class="controls">
            <button id="callBtn" class="call-btn">Call Next Ball</button>
            <button id="autoBtn" class="auto-btn">Auto Call: Off</button>
            <button id="voiceBtn" class="voice-btn">Voice: On</button>
            <button id="resetBtn" class="reset-btn">Reset Game</button>
          </div>

          <div class="settings settings-wrap">
            <div class="inline-label">Voice
              <select id="voiceSelect"></select>
            </div>
            <div class="inline-label">Speed
              <select id="styleSelect">
                <option value="classic">Classic</option>
                <option value="fast">Fast</option>
                <option value="dramatic">Dramatic</option>
              </select>
            </div>
            <div class="inline-label">Auto every
              <select id="intervalSelect">
                <option value="3000">3 sec</option>
                <option value="5000" selected>5 sec</option>
                <option value="7000">7 sec</option>
                <option value="10000">10 sec</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="card history-wrap">
        <h2>Called History</h2>
        <div id="history" class="history"></div>
      </div>
    </div>

    <div class="card board-wrap">
      <h2>All Bingo Balls</h2>
      <div id="board" class="board"></div>
    </div>

    <div class="footer-note">B = 1–15, I = 16–30, N = 31–45, G = 46–60, O = 61–75</div>
  </div>

  <script>
    const state = {
      remaining: [],
      called: [],
      voiceOn: true,
      voices: [],
      autoMode: false,
      autoTimer: null,
      busy: false
    };

    const letterEl = document.getElementById('letter');
    const numberEl = document.getElementById('number');
    const calloutEl = document.getElementById('callout');
    const statusEl = document.getElementById('status');
    const historyEl = document.getElementById('history');
    const boardEl = document.getElementById('board');
    const callBtn = document.getElementById('callBtn');
    const autoBtn = document.getElementById('autoBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const resetBtn = document.getElementById('resetBtn');
    const voiceSelect = document.getElementById('voiceSelect');
    const styleSelect = document.getElementById('styleSelect');
    const intervalSelect = document.getElementById('intervalSelect');

    function getLetter(num) {
      if (num <= 15) return 'B';
      if (num <= 30) return 'I';
      if (num <= 45) return 'N';
      if (num <= 60) return 'G';
      return 'O';
    }

    function buildBoard() {
      boardEl.innerHTML = '';
      ['B', 'I', 'N', 'G', 'O'].forEach(letter => {
        const head = document.createElement('div');
        head.className = 'col-head';
        head.textContent = letter;
        boardEl.appendChild(head);
      });

      for (let row = 0; row < 15; row++) {
        for (let col = 0; col < 5; col++) {
          const value = col * 15 + row + 1;
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.id = `ball-${value}`;
          cell.textContent = value;
          boardEl.appendChild(cell);
        }
      }
    }

    function initGame() {
      stopAuto();
      state.remaining = Array.from({ length: 75 }, (_, i) => i + 1);
      state.called = [];
      state.busy = false;
      letterEl.textContent = '—';
      numberEl.textContent = 'Start';
      calloutEl.textContent = 'Ready to call';
      statusEl.textContent = '75 balls remaining';
      historyEl.innerHTML = '';
      callBtn.disabled = false;

      for (let i = 1; i <= 75; i++) {
        const cell = document.getElementById(`ball-${i}`);
        if (cell) cell.classList.remove('called');
      }
    }

    function loadVoices() {
      if (!('speechSynthesis' in window)) {
        voiceSelect.innerHTML = '<option>No voices available</option>';
        return;
      }

      const previousValue = voiceSelect.value;
      state.voices = window.speechSynthesis.getVoices();
      voiceSelect.innerHTML = '';

      state.voices.forEach((voice, i) => {
        const option = document.createElement('option');
        option.value = i;
        option.textContent = `${voice.name} (${voice.lang})`;
        voiceSelect.appendChild(option);
      });

      if (state.voices.length) {
        const englishIndex = state.voices.findIndex(v => /en-/i.test(v.lang));
        voiceSelect.value = previousValue && state.voices[previousValue] ? previousValue : String(Math.max(englishIndex, 0));
      }
    }

    function getCallPhrase(letter, number) {
      const style = styleSelect.value;
      if (style === 'fast') return `${letter} ${number}`;
      if (style === 'dramatic') return `${letter}... ${number}... ${letter} ${number}`;
      return `${letter}... ${number}... ${letter} ${number}`;
    }

    function speak(text) {
      if (!state.voiceOn || !('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      const selectedVoice = state.voices[voiceSelect.value];
      if (selectedVoice) utter.voice = selectedVoice;

      if (styleSelect.value === 'fast') {
        utter.rate = 1.08;
        utter.pitch = 1;
      } else if (styleSelect.value === 'dramatic') {
        utter.rate = 0.82;
        utter.pitch = 1;
      } else {
        utter.rate = 0.94;
        utter.pitch = 1;
      }

      window.speechSynthesis.speak(utter);
    }

    function updateHistory() {
      historyEl.innerHTML = '';
      [...state.called].reverse().forEach((item, index) => {
        const chip = document.createElement('div');
        chip.className = `chip ${index === 0 ? 'latest' : ''}`;
        chip.textContent = `${item.letter}-${item.number}`;
        historyEl.appendChild(chip);
      });
    }

    function animateCurrent() {
      letterEl.classList.remove('pulse');
      numberEl.classList.remove('pulse');
      void letterEl.offsetWidth;
      void numberEl.offsetWidth;
      letterEl.classList.add('pulse');
      numberEl.classList.add('pulse');
    }

    function setBusy(value) {
      state.busy = value;
      callBtn.disabled = value || state.remaining.length === 0;
    }

    function callNextBall() {
      if (state.busy || state.remaining.length === 0) return;
      setBusy(true);

      const index = Math.floor(Math.random() * state.remaining.length);
      const number = state.remaining.splice(index, 1)[0];
      const letter = getLetter(number);
      const calledItem = { letter, number };
      state.called.push(calledItem);

      letterEl.textContent = letter;
      numberEl.textContent = number;
      calloutEl.textContent = `${letter}-${number}`;
      animateCurrent();

      const left = state.remaining.length;
      statusEl.textContent = left === 0 ? 'All 75 balls have been called' : `${left} ball${left === 1 ? '' : 's'} remaining`;

      const cell = document.getElementById(`ball-${number}`);
      if (cell) cell.classList.add('called');

      updateHistory();
      speak(getCallPhrase(letter, number));

      if (left === 0) {
        callBtn.disabled = true;
        calloutEl.textContent = 'Game complete';
        stopAuto();
      }

      setTimeout(() => {
        if (state.remaining.length > 0) setBusy(false);
      }, 500);
    }

    function stopAuto() {
      if (state.autoTimer) {
        clearInterval(state.autoTimer);
        state.autoTimer = null;
      }
      state.autoMode = false;
      autoBtn.textContent = 'Auto Call: Off';
    }

    function startAuto() {
      stopAuto();
      if (state.remaining.length === 0) return;
      state.autoMode = true;
      autoBtn.textContent = 'Auto Call: On';
      const interval = Number(intervalSelect.value);
      state.autoTimer = setInterval(() => {
        if (state.remaining.length === 0) {
          stopAuto();
          return;
        }
        callNextBall();
      }, interval);
    }

    function toggleAuto() {
      if (state.autoMode) stopAuto();
      else startAuto();
    }

    voiceBtn.addEventListener('click', () => {
      state.voiceOn = !state.voiceOn;
      voiceBtn.textContent = `Voice: ${state.voiceOn ? 'On' : 'Off'}`;
      if (!state.voiceOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    });

    intervalSelect.addEventListener('change', () => {
      if (state.autoMode) startAuto();
    });

    callBtn.addEventListener('click', callNextBall);
    autoBtn.addEventListener('click', toggleAuto);
    resetBtn.addEventListener('click', initGame);

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    buildBoard();
    initGame();
    loadVoices();
  </script>
</body>
</html>
